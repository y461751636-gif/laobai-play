name: 发布游乐场入口

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 准备页面
        run: |
          mkdir /tmp/site
          cp index.html youyou-island.html style.css entry.mjs route.mjs endpoint.json laobai-share.png laobai-64.png youyou-island-share-20261027.jpg .nojekyll /tmp/site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
